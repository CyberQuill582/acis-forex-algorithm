[project]
name = "acis"
version = "0.1.0"
description = "ACIS — Adaptive Capital Intelligence System (deterministic multi-asset trading engine)"
requires-python = ">=3.11"
dependencies = [
    "structlog",
    "pydantic>=2",
    "pydantic-settings",
    "PyYAML",
    "aiohttp>=3.9,<4",   # the cTrader adapter's JSON-over-WebSocket transport (ACIS-13 §3.3, route C; named in SPEC §16)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "numpy>=2.4,<2.5"]   # numpy: the R1.1 synthetic lab (tests/backtest/lab_*.py); named in SPEC §16

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

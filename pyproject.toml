[project]
name = "acis"
version = "0.1.0"
description = "ACIS — Adaptive Capital Intelligence System (deterministic multi-asset trading engine)"
requires-python = ">=3.11"
dependencies = [
    "structlog",
    "pydantic>=2",
    "pydantic-settings",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

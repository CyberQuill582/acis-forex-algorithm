# The demo host's drop-in for deploy/systemd/acis-watchdog.service (GAP-P12D-134).
# Install as /etc/systemd/system/acis-watchdog.service.d/demo-host.conf on acis-demo-1:
# the checkout is /opt/acis/repo and everything runs as the owner's login user (USER),
# because the owner starts the practice engine by hand in tmux as that user.
[Service]
User=USER
Group=USER
WorkingDirectory=/opt/acis/repo
Environment=PYTHONPATH=/opt/acis/repo
EnvironmentFile=
EnvironmentFile=/etc/acis/watchdog.env
ExecStart=
ExecStart=/opt/acis/venv/bin/python scripts/acis_watchdog.py
ReadWritePaths=
ReadWritePaths=/opt/acis/repo/logs

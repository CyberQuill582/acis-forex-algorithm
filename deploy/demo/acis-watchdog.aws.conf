# The AWS demo host's drop-in for deploy/systemd/acis-watchdog.service (owner ruling 2026-10-01,
# "Hybrid, on AWS"). Install as /etc/systemd/system/acis-watchdog.service.d/demo-host.conf
# (deploy/aws/acis-demo-prepare.sh does): the checkout is /opt/acis/repo, and the watchdog and the
# practice engine both run as the `acis` user, which has no sudo; the owner starts practice with
# `sudo -u acis tmux new -s acis`. /etc/acis/watchdog.env stays root 600 (systemd reads it).
[Service]
User=acis
Group=acis
WorkingDirectory=/opt/acis/repo
Environment=PYTHONPATH=/opt/acis/repo
EnvironmentFile=
EnvironmentFile=/etc/acis/watchdog.env
ExecStart=
ExecStart=/opt/acis/venv/bin/python scripts/acis_watchdog.py
ReadWritePaths=
ReadWritePaths=/opt/acis/repo/logs

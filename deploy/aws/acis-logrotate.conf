# ACIS demo host (AWS): rotate the two high-volume engine logs (GAP-P12D-138, owner ruling 2026-10-04).
# data_log (every tick of every pair) and signal_log grow ~0.5-0.8 GB a day together; the 30 GB disk would
# fill 5-8 weeks after the cutover. The engine opens each log in append mode, so copytruncate is safe for
# its writers. The small evidence logs (trade, risk, target, governor, venue_events) are NOT rotated here:
# they are the operational-referent record and the weekly report's input.
/opt/acis/repo/logs/data_log.jsonl /opt/acis/repo/logs/signal_log.jsonl {
    daily
    rotate 60
    maxsize 1G
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d-%s
    missingok
    notifempty
    copytruncate
    su acis acis
}

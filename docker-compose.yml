# ACIS local/VPS supervision via Compose (pre-phase-12 deployment-readiness gate).
#
# Two SEPARATE processes, by design (SPEC §8.6): the watchdog must not die with
# the engine, so it is its own container with its own restart policy. They share
# ONE volume — the logs dir — so the engine's heartbeat file (logs/heartbeat.json)
# is visible to the watchdog, which flattens from outside the blast radius on
# silence-with-open-positions.
#
# The `watchdog` service starts by default. The `engine` service runs the three-loop
# runtime (core/runtime/, 2026-09-30) behind the `engine` profile: it needs the venue
# credentials in the deploy environment first (TODO Track A). The Google server runs
# the bare-VPS equivalents in deploy/systemd/.

services:
  watchdog:
    build: .
    image: acis:latest
    container_name: acis-watchdog
    command: ["python", "scripts/acis_watchdog.py"]
    restart: unless-stopped
    environment:
      # A reference only — the real secret is injected by the deploy environment,
      # never committed (see config/watchdog.yaml credentials_ref).
      - ACIS_WATCHDOG_CREDENTIALS=${ACIS_WATCHDOG_CREDENTIALS:-}
    volumes:
      - acis-logs:/app/logs
    read_only: true          # the engine cannot reach the watchdog's config/blast radius
    tmpfs:
      - /tmp

  engine:
    build: .
    image: acis:latest
    container_name: acis-engine
    profiles: ["engine"]     # started only once the venue credentials are in the environment
    # boots in PAPER on the venue's prices; practice needs a human at a terminal (master §7.5)
    command: ["python", "-m", "core.runtime", "--venue", "--account", "pepperstone_demo"]
    restart: unless-stopped
    environment:
      - ACIS_CTRADER_CLIENT_ID=${ACIS_CTRADER_CLIENT_ID:-}
      - ACIS_CTRADER_CLIENT_SECRET=${ACIS_CTRADER_CLIENT_SECRET:-}
      - ACIS_CTRADER_TOKEN_STORE=/app/data/venue/ctrader_tokens.json
    volumes:
      - acis-logs:/app/logs
      - acis-data:/app/data

volumes:
  acis-logs:
  acis-data:

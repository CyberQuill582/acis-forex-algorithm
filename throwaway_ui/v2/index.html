<!doctype html>
<!--
  ⚠ THROWAWAY UI v2 — EXPERIMENTAL (2026-09-14). Not a spec deliverable, not wired to anything.
  Mock data in-page; no network calls, no port (so no MCP side channel, C-MCP-4).
  Buttons imitate monitoring/tools.py. IRIS is an original SVG illustration + canned copy (no LLM).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACIS · IRIS desk (throwaway v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Doto:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17131C; --ink2:#4A4452; --mute:#8A8391; --faint:#B7B0BD;
  --pink:#FF4F87; --pink2:#FF7EA8; --blush:#FFE1EA; --lens:#FF3B5C;
  --mint:#2FBF83; --mint-soft:#DDF7EA; --butter:#FFC23D; --butter-soft:#FFF1CC;
  --orange:#FF8A3D; --orange-soft:#FFE6D4; --red:#F2385A; --red-soft:#FFDDE3;
  --sky:#DCEBFF; --lilac:#ECE4FF; --teal:#155A7A;
  --glass:rgba(255,255,255,.64); --glass-line:rgba(255,255,255,.85);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --serif:"Instrument Serif","Didot","Bodoni MT",Georgia,serif;
  --sans:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --dot:"Doto","Courier New",ui-monospace,monospace;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 12px 40px rgba(130,60,100,.10),0 2px 6px rgba(130,60,100,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.5 var(--sans);background:#FFF3EE;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}

/* ---------------- background scene ---------------- */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene svg.wash{position:absolute;inset:0;width:100%;height:100%}
.orb{position:absolute;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;
  font:700 calc(var(--s)*.36)/1 var(--display);color:rgba(23,19,28,.55);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.35) 45%,rgba(255,255,255,.12) 70%);
  border:1px solid rgba(255,255,255,.9);box-shadow:inset -8px -10px 24px rgba(255,120,170,.18),0 18px 40px rgba(150,80,120,.10);
  backdrop-filter:blur(4px);animation:float var(--d) ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-26px) rotate(5deg)}}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}

/* ---------------- shell ---------------- */
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding-inline:24px;padding-block:18px 150px}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);border:1px solid var(--glass-line);box-shadow:var(--shadow)}

/* nav */
.nav{position:sticky;top:14px;z-index:30;display:flex;align-items:center;gap:6px;border-radius:999px;padding:8px 8px 8px 18px}
.logo{display:flex;align-items:center;gap:9px;margin-right:10px}
.logo b{font:800 22px/1 var(--display);letter-spacing:-.04em}
.logo b i{color:var(--pink);font-style:normal}
.sticker{font:800 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:8px;
  background:repeating-linear-gradient(-45deg,#FFE98A 0 7px,#FFDC5C 7px 14px);color:#6B4E00;transform:rotate(-4deg);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.tabs{display:flex;gap:2px;margin-left:8px}
.tabs button{padding:8px 14px;border-radius:999px;color:var(--ink2);font-weight:600;font-size:13.5px}
.tabs button:hover{background:rgba(255,255,255,.7)}
.tabs button.on{background:var(--ink);color:#fff}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.75);font-weight:600;font-size:13px;color:var(--ink2)}
.chip:hover{background:#fff}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,131,.5)}70%{box-shadow:0 0 0 8px rgba(47,191,131,0)}100%{box-shadow:0 0 0 0 rgba(47,191,131,0)}}
.halt{display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:13.5px}
.halt .rec{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(242,56,90,.3)}
.halt:hover{background:#000}
.halt.on{background:var(--red)}
.halt.on .rec{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}

/* hero grid */
.hero{display:grid;grid-template-columns:1.12fr 1fr;gap:18px;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* poster */
.poster{position:relative;border-radius:34px;overflow:hidden;min-height:640px;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 30%,#FFA3C3 0,#FF77A2 42%,#FF4F87 100%);box-shadow:0 30px 60px rgba(255,79,135,.28)}
.poster .meta{position:absolute;top:26px;left:30px;right:30px;display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:13px;line-height:1.35;z-index:3}
.poster .meta small{display:block;font-weight:500;opacity:.85}
.halo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:560px;height:560px;z-index:0;opacity:.9}
.iris{position:absolute;left:40%;bottom:0;transform:translateX(-50%);height:90%;max-height:620px;width:auto;z-index:1}
.ptype{position:absolute;left:30px;bottom:26px;z-index:2;color:#fff;pointer-events:none}
.ptype .a{font:800 clamp(88px,10.5vw,168px)/.78 var(--display);letter-spacing:-.055em;text-shadow:0 10px 40px rgba(120,0,50,.25)}
.ptype .b{font:italic 400 clamp(44px,5vw,76px)/1 var(--serif);margin:-.12em 0 0 1.05em;text-shadow:0 6px 24px rgba(120,0,50,.3)}
.bubble{position:absolute;top:150px;right:22px;z-index:3;max-width:215px;background:#fff;color:var(--ink);border-radius:24px 24px 24px 6px;
  padding:14px 16px 13px;font:600 15px/1.4 var(--sans);box-shadow:0 18px 40px rgba(120,0,50,.22)}
.bubble .who{display:flex;align-items:center;gap:6px;font:800 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--pink);margin-bottom:6px}
.bubble .who i{width:6px;height:6px;border-radius:50%;background:var(--pink)}
.bubble.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.85) translateY(8px);opacity:.2}100%{transform:none;opacity:1}}
.mood{position:absolute;top:78px;left:30px;z-index:3;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  background:rgba(23,19,28,.22);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:12px}
.mood i{width:7px;height:7px;border-radius:50%;background:#fff}

/* IRIS moods */
#irisHead{transform-origin:200px 300px;transform-box:view-box;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(-1.5deg) translateY(2px)}}
#glasses,#browR,#browL{transition:transform .45s cubic-bezier(.3,1.5,.5,1);transform-box:view-box}
.lips-pleased,.lips-stern{display:none}
.mood-pleased .lips-smirk,.mood-stern .lips-smirk{display:none}
.mood-pleased .lips-pleased,.mood-stern .lips-stern{display:inline}
.mood-side #glasses{transform:translateY(25px)}
.mood-side #browR{transform:translateY(-8px)}
.mood-stern #browL{transform:translateY(4px)}
.mood-stern #browR{transform:translateY(3px)}
.mood-pleased #browR{transform:translateY(-3px)}

/* cards */
.card{border-radius:30px;padding:22px}
.label{font:700 12px/1 var(--sans);color:var(--mute);letter-spacing:.02em}
.num{font:800 clamp(40px,4.4vw,58px)/1 var(--display);letter-spacing:-.045em}
.num small{font-size:.45em;color:var(--mute);letter-spacing:-.02em}
.delta{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:12.5px;background:var(--mint-soft);color:#16865A}
.row{display:flex;align-items:center;gap:10px}
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;font-size:12px;color:var(--ink2)}
.act span.c{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid rgba(23,19,28,.07);
  box-shadow:0 6px 16px rgba(130,60,100,.10);transition:transform .15s, box-shadow .15s}
.act:hover span.c{transform:translateY(-3px);box-shadow:0 12px 24px rgba(130,60,100,.16)}
.act.danger span.c{background:var(--ink);color:#fff}
.act.danger.on span.c{background:var(--red)}
.act .lock{position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:var(--butter);display:grid;place-items:center;border:2px solid #fff}
.spark{margin-top:12px;height:74px}

/* threat level */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.lvl{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700;font-size:12px;color:var(--faint);transition:all .3s}
.oct{width:64px;height:64px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:grid;place-items:center;background:#F3EEF2;transition:all .3s}
.oct i{width:18px;height:18px;border-radius:50%;background:#DCD5DB}
.lvl small{display:block;font-weight:500;font-size:11px}
.lvl.on{color:var(--ink)}
.lvl.on .oct{transform:scale(1.08)}
.lvl.l0.on .oct{background:var(--mint-soft)} .lvl.l0.on .oct i{background:var(--mint);box-shadow:0 0 16px var(--mint)}
.lvl.l1.on .oct{background:var(--butter-soft)} .lvl.l1.on .oct i{background:var(--butter);box-shadow:0 0 16px var(--butter)}
.lvl.l2.on .oct{background:var(--orange-soft)} .lvl.l2.on .oct i{background:var(--orange);box-shadow:0 0 16px var(--orange)}
.lvl.l3.on .oct{background:var(--red-soft)} .lvl.l3.on .oct i{background:var(--red);box-shadow:0 0 16px var(--red)}
.meter{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 8px;position:relative}
.meter span{width:10px;height:10px;border-radius:50%;background:#EFE8EE}
.meter span.f{background:var(--ink)}
.meter span.t{outline:2px solid var(--butter);outline-offset:2px}
.meter span.h{outline:2px solid var(--orange);outline-offset:2px}
.dotnum{font:800 30px/1 var(--dot);letter-spacing:.02em}

/* bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}
.tile{border-radius:28px;padding:20px;min-height:250px;display:flex;flex-direction:column;min-width:0;scroll-margin-top:90px}
.tile.w2{grid-column:span 2}
.th{display:flex;align-items:baseline;gap:10px;font:700 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px}
.th b{font:800 13px/1 var(--dot);color:var(--pink);letter-spacing:0}
.th .sp{flex:1}
.th .tag{letter-spacing:.04em;text-transform:none;font-weight:600;color:var(--mute)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:12px}
.k{font:600 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.regs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.reg{display:flex;align-items:center;gap:7px;font-size:12px;min-width:0}
.reg b{font-weight:700;width:58px;flex-shrink:0}
.reg span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.reg.dead span{text-decoration:line-through;text-decoration-color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:34px 1fr 42px;align-items:center;gap:8px;font-size:12px;font-weight:700}
.bar .dots{display:flex;gap:3px}
.bar .dots span{flex:1;aspect-ratio:1;max-width:9px;border-radius:50%;background:#EFE8EE}
.bar .dots span.f{background:var(--pink)}
.bar em{font-style:normal;color:var(--mute);text-align:right;font-family:var(--mono);font-size:11px}
.cols{display:flex;align-items:flex-end;gap:14px;height:120px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.col span{width:9px;height:9px;border-radius:50%;background:#EFE8EE}
.col span.f{background:var(--ink)}
.col span.f.top{background:var(--pink)}
.col label{margin-top:6px;font-size:10.5px;color:var(--mute);text-align:center;line-height:1.2;height:26px}
.pos{display:flex;flex-direction:column;gap:8px}
.p{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.7)}
.p b{font-weight:800}
.side{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.side.long{background:var(--mint-soft);color:#16865A}.side.short{background:var(--red-soft);color:#B42043}
.pnl{margin-left:auto;font:600 12.5px var(--mono)}.pnl.neg{color:#B42043}.pnl.gain{color:#16865A}
.tape{display:flex;flex-direction:column;gap:6px;font:11.5px/1.5 var(--mono);color:var(--ink2)}
.tape div{padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.55);word-break:break-word}
.tape .ts{color:var(--faint)}.tape .ev{color:var(--teal);font-weight:600}
.tape .flag{background:var(--blush);border:1px dashed #FF9DBA}
.tape .flag q{display:block;margin-top:4px;font:italic 400 16px/1.2 var(--serif);color:var(--pink);quotes:none}
.rcpt{display:flex;flex-direction:column;gap:6px}
.rc{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:14px;background:rgba(255,255,255,.7);min-width:0}
.rc b{font-weight:700;font-size:13px;white-space:nowrap}
.res{font:500 11px var(--mono);padding:3px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.res.ok{background:var(--mint-soft);color:#16865A}.res.rejected{background:var(--red-soft);color:#B42043}.res.idempotent_replay{background:var(--sky);color:#2C5A94}
.ib{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex-shrink:0}
.ib:hover{background:#fff;color:var(--ink)}
.empty{color:var(--mute);font:italic 400 20px/1.3 var(--serif);padding:10px 0}
.ecg{width:100%;height:90px}
.blip{offset-path:path('M0 45 L70 45 L84 45 L92 20 L104 72 L114 8 L126 60 L134 45 L210 45 L224 45 L232 28 L244 62 L252 45 L320 45');animation:blip 2.8s linear infinite}
@keyframes blip{from{offset-distance:0%}to{offset-distance:100%}}
.ring{width:132px;height:132px;margin:0 auto}

/* dock */
.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;width:min(760px,calc(100% - 32px));border-radius:999px;padding:8px 8px 8px 10px;display:flex;align-items:center;gap:8px}
.face{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFA3C3,#FF4F87);overflow:hidden;flex-shrink:0;display:grid;place-items:end center}
.face svg{width:60px;height:auto;margin-bottom:-18px}
.dock input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;font-weight:500;padding:8px 4px}
.dock input::placeholder{color:var(--mute)}
.dk{height:40px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.8);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.dk:hover{background:#fff}
.go{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0}
.go:disabled{background:#CFC7D2}
.menu{position:absolute;left:12px;right:12px;bottom:calc(100% + 10px);border-radius:24px;padding:8px;max-height:380px;overflow:auto;background:rgba(255,255,255,.92)}
.menu .mh{padding:6px 12px 6px;font:700 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:14px;text-align:left}
.opt:hover,.opt.hl{background:var(--blush)}
.opt code{font:600 13px var(--mono)}
.opt .d{flex:1;min-width:0;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.who.any{background:var(--mint-soft);color:#16865A}.who.human{background:var(--butter-soft);color:#8A5A00}.who.read{background:var(--sky);color:#2C5A94}

/* modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(60,20,40,.22);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(500px,100%);border-radius:32px;padding:26px;background:rgba(255,255,255,.94);box-shadow:0 40px 90px rgba(90,20,60,.25);animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-height:calc(100vh - 32px);overflow:auto}
.modal h3{margin:0;font:800 30px/1.05 var(--display);letter-spacing:-.035em}
.modal h3 em{font:italic 400 1.05em var(--serif);letter-spacing:0;color:var(--pink)}
.quip{display:flex;gap:10px;align-items:center;margin:12px 0 18px;padding:10px 12px;border-radius:18px;background:var(--blush);font-weight:600;font-size:13.5px}
.quip .face{width:36px;height:36px}.quip .face svg{width:50px;margin-bottom:-15px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:12.5px}
.field input,.field textarea{border:1.5px solid #EDE4EA;border-radius:14px;padding:11px 13px;outline:0;background:#fff}
.field input:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px var(--blush)}
.hint{font-size:12px;color:var(--mute)}
.hint code{font:500 11.5px var(--mono);background:#F5EFF3;padding:2px 6px;border-radius:6px;color:var(--ink2)}
.hint button{color:var(--pink);font-weight:700;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:#F5EFF3;margin-bottom:14px}
.seg button{padding:9px;border-radius:999px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.warn{padding:12px 14px;border-radius:18px;background:var(--red-soft);color:#9A1B3A;font-size:12.5px;font-weight:600;margin-bottom:14px}
.verdict{min-height:28px;margin-bottom:8px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn{padding:12px 20px;border-radius:999px;font-weight:800}
.btn.sec{background:#F5EFF3}.btn.sec:hover{background:#EDE4EA}
.btn.pri{background:var(--ink);color:#fff}.btn.pri:hover{background:#000}
.json{margin:0;padding:14px;border-radius:18px;background:#1D1722;color:#F7E9F0;font:11.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto}

/* responsive */
@media (max-width:1180px){ .bento{grid-template-columns:repeat(2,1fr)} .tabs{display:none} }
@media (max-width:980px){ .hero{grid-template-columns:1fr} .poster{min-height:600px} }
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .bento{grid-template-columns:1fr} .tile.w2{grid-column:auto}
  .actions{grid-template-columns:repeat(3,1fr);row-gap:14px}
  .levels{grid-template-columns:repeat(2,1fr);row-gap:14px}
  .poster{min-height:560px}
  .bubble{top:auto;bottom:150px;right:16px;left:auto;max-width:210px;font-size:13.5px}
  .halo{width:420px;height:420px}
  .chip.hb,.dk.txt{display:none}
  .nav{padding-left:12px}
}
</style>
</head>
<body>

<!-- ================= background scene ================= -->
<div class="scene" aria-hidden="true">

function validatePatch(patch){
  if(!patch||typeof patch!=='object'||!Object.keys(patch).length) return 'empty_or_invalid_patch';
  for(const [raw,val] of Object.entries(patch)){
    const p=String(raw).trim(), low=p.toLowerCase();
    if(low.startsWith('guardrail_limits')||low.includes('equity_floor')||Object.hasOwn(GUARD,low)) return `guardrail_path:${p}`;
    if(!Object.hasOwn(ALLOW,p)) return `not_allowlisted:${p}`;
    const n=typeof val==='number'?val:Number(val);
    if(typeof val==='boolean'||val===''||!Number.isFinite(n)) return `non_finite_value:${p}`;
    const [lo,hi]=ALLOW[p]; if(n<lo||n>hi) return `out_of_bounds:${p}:[${lo},${hi}]`;
  }
  return null;
}

    case 'acis_set_mode':{const m=a.mode;if(!['backtest','paper','live'].includes(m)) return [`rejected:bad_mode:${m}`,true];

}

}

  if(r.includes('auth')) return ['No token, no party. Anyone can stop me. Only you can start me.','side'];
  if(r.includes('guardrail_path')) return ["Loosen the guardrails? Adorable. They're not on my menu.",'side'];
  if(r.includes('not_allowlisted')) return ["Never heard of that knob. Not on the allowlist, doesn't exist.",'side'];
  if(r.includes('out_of_bounds')) return ['Outside the lines. I colour inside them.','side'];
  if(r.includes('non_finite')) return ['Numbers, please. Finite ones.','side'];
  if(r.includes('hash_not_acknowledged')) return ["Acknowledge both hashes first. I'm counting.",'side'];
  if(r.includes('live_gate_closed')) return ['Lovely hashes. Still no. Out-of-sample receipts and your sign-off, then we talk.','side'];
  if(r.includes('bad_mode')) return ["That isn't a mode. That's a mood.",'side'];
  if(r.startsWith('ok:halted')) return ["Brakes on. Resuming is your signature, darling, not mine.",'stern'];
  if(r.startsWith('ok:flattened')) return ["Book's flat. Clean slate, clean conscience.",'pleased'];
  if(r.startsWith('ok:resumed')) return ['Token checks out. Back to work.','pleased'];
  if(r.startsWith('ok:mode')) return [`Mode: ${S.mode}. Try not to miss me.`,'pleased'];
  if(r.startsWith('ok:staged')) return ['Staged. It waits for the session boundary like everyone else.','pleased'];
  if(r.startsWith('ok:bt_')) return ["Queued. And no, in-sample numbers don't count.",'smirk'];
  if(r.startsWith('ok:report')) return ['Report is ready. The numbers did the talking.','pleased'];
  return ['Done.','smirk'];
}

let menu=null, hl=0, items=[];

function submit(){
  const raw=input.value.trim(); if(!raw) return;
  closeMenu(); input.value=''; go.disabled=true;
  if(raw.startsWith('acis://')) return runRead(raw.split(/\s+/)[0]);
  if(!raw.startsWith('/')) return say("I'm deterministic, not conversational. Commands only. Try /halt.",'side');
  const [cmd,...rest]=raw.slice(1).split(/\s+/).filter(Boolean);
  switch(cmd){
    case 'halt':{const scope=INSTR.includes((rest[0]||'').toUpperCase())?rest[0].toUpperCase():'all';return runTool('acis_halt',{scope,reason:'owner_desk'});}
    case 'flatten':return runTool('acis_flatten',{reason:'owner_desk'});

    case 'stage':{const patch={};rest.forEach(w=>{const m=w.match(/^([^=]+)=(.+)$/);if(m) patch[m[1]]=isNaN(+m[2])?m[2]:+m[2];});
      return Object.keys(patch).length?runTool('acis_stage_config',{patch}):openStage();}

  [['Desk','desk'],['Regimes','regimes'],['Tape','tape'],['Receipts','receipts']].forEach(([l,id],k)=>tabs.append(h('button',{class:k===0?'on':'',onclick:e=>{
    tabs.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.currentTarget.classList.add('on');document.getElementById(id).scrollIntoView({block:id==='desk'?'start':'center'});}},l)));
  $('#haltNav').onclick=()=>S.halted?openToken():runTool('acis_halt',{scope:'all',reason:'owner_desk'});
  $('#modeChip').onclick=()=>openMode();
  renderScene(); renderSpark(); render();
  const hr=new Date().getHours();
  say(hr<5?"Up this late? Fine. I'm watching the book so you don't have to.":hr<12?'Morning. Seven of eight tradeable, and nobody has touched my guardrails.':hr<18?'Afternoon. The book is calm. Let\'s keep it boring.':"Evening. I've got the book. You've got the resume button.",'smirk');
  let idle=0;
  setInterval(()=>{ if(Math.random()<.3) S.beat=Date.now(); const s=Math.round((Date.now()-S.beat)/1000);
    $('#beat').textContent=`heartbeat ${s}s`; const bn=$('#beatNum'); if(bn) bn.textContent=s+'s';
    if(Date.now()-lastSay>14000 && !document.querySelector('.scrim')){ say(S.halted?"Still halted. The resume button has your name on it.":IDLE[idle++%IDLE.length], S.halted?'stern':'smirk'); } },1000);
})();
</script>

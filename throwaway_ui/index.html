<!doctype html>
<!--
  ⚠ THROWAWAY UI — EXPERIMENTAL (2026-09-14). Not a spec deliverable, not wired to anything.
  All data is mock and in-page; no network, no port (so no MCP side channel, C-MCP-4).
  The buttons imitate the real contract in monitoring/tools.py. See throwaway_ui/README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACIS Console (throwaway)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5; --side:#F3F1EA; --card:#FFFFFF; --line:#EAE7DD; --line2:#DDD9CC;
  --ink:#1F1E1D; --ink2:#44433F; --mute:#7C7A71; --faint:#A9A69B;
  --clay:#D97757; --clay-d:#BF5E3D; --clay-soft:#F8E7DE;
  --sage:#E5EEDE; --sage-ink:#44603A; --sky:#E3ECF5; --sky-ink:#35597A;
  --butter:#F7EECF; --butter-ink:#7A5A12; --blush:#F7E1DA; --blush-ink:#9A3B26;
  --lilac:#ECE7F5; --lilac-ink:#5B4A80; --stone:#EFEDE6;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(31,30,29,.04),0 4px 18px rgba(31,30,29,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:var(--mono);font-size:12px}

/* ---------- app grid ---------- */
.app{display:grid;grid-template-columns:268px 1fr auto;grid-template-rows:100%;height:100vh}
.app>*{min-height:0;height:100%}
.app.side-collapsed{grid-template-columns:64px 1fr auto}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;padding:14px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand b{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.01em}
.tag{font:500 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:var(--butter);color:var(--butter-ink)}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mute)}
.icon-btn:hover{background:rgba(31,30,29,.06);color:var(--ink)}
.new-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--clay-d);font-weight:500}
.new-btn .plus{width:24px;height:24px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center}
.new-btn:hover{background:var(--clay-soft)}
.nav{margin-top:6px;display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);text-align:left}
.nav button:hover{background:rgba(31,30,29,.05)}
.nav button.on{background:#E9E6DC;color:var(--ink)}
.nav svg{color:var(--mute)}
.side h6{margin:20px 10px 6px;font:500 11px/1 var(--sans);color:var(--faint);letter-spacing:.02em}
.recents{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px;min-height:0}
.recents button{padding:7px 10px;border-radius:8px;text-align:left;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.recents button:hover{background:rgba(31,30,29,.05)}
.recents .empty{padding:6px 10px;color:var(--faint);font-size:13px}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid var(--line);margin-top:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:500 13px var(--sans)}
.me small{display:block;color:var(--mute);font-size:12px}
.beat{width:7px;height:7px;border-radius:50%;background:#6FA05B;box-shadow:0 0 0 0 rgba(111,160,91,.5);animation:beat 2.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(111,160,91,.45)}70%{box-shadow:0 0 0 7px rgba(111,160,91,0)}100%{box-shadow:0 0 0 0 rgba(111,160,91,0)}}
.side-collapsed .side .hide-c{display:none}
.side-collapsed .side{align-items:center}
.side-collapsed .nav button{justify-content:center}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0}
.app:has(.pane:not(.open)) .topbar{padding-right:84px}
.session{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;font-weight:500;color:var(--ink2)}
.session:hover{background:rgba(31,30,29,.05)}
.session span{color:var(--mute);font-weight:400}
.spacer{flex:1}
.halt-btn{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;border:1px solid #EBC6B6;color:var(--clay-d);font-weight:500;background:#fff}
.halt-btn:hover{background:var(--clay-soft)}
.halt-btn.is-halted{background:var(--clay);color:#fff;border-color:var(--clay)}
.halted-bar{margin:0 16px;border-radius:12px;background:var(--clay-soft);color:var(--blush-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px}
.halted-bar b{font-weight:600}
.halted-bar button{margin-left:auto;padding:6px 12px;border-radius:8px;background:#fff;border:1px solid #EBC6B6;display:flex;gap:6px;align-items:center;color:var(--ink)}

.scroll{flex:1;overflow:auto;min-height:0}
.column{max-width:768px;margin:0 auto;padding:0 20px}

/* hero */
.hero{min-height:calc(100vh - 72px);display:flex;flex-direction:column;justify-content:center;padding-bottom:9vh}
.hello{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.hello h1{font:300 clamp(30px,4.2vw,42px)/1.1 var(--serif);letter-spacing:-.015em;margin:0;color:var(--ink2)}
.subline{text-align:center;color:var(--mute);margin:0 0 28px;font-size:14px}
.subline i{font-style:normal;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chip{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-size:13px}
.chip:hover{background:#fff;border-color:var(--line2)}
.chip svg{color:var(--mute)}

/* composer */
.composer{background:#fff;border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);padding:14px 14px 10px 16px;position:relative;transition:border-color .15s, box-shadow .15s}
.composer:focus-within{border-color:#CFCABB;box-shadow:0 1px 2px rgba(31,30,29,.05),0 8px 28px rgba(31,30,29,.07)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15.5px;line-height:1.5;min-height:48px;max-height:200px;padding:2px 0}
.composer textarea::placeholder{color:var(--faint)}
.ctools{display:flex;align-items:center;gap:6px;margin-top:6px}
.ghost{height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.ghost:hover{background:var(--stone)}
.mode-pill{height:32px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.mode-pill:hover{background:var(--stone)}
.mode-dot{width:7px;height:7px;border-radius:50%;background:#6FA05B}
.send{width:32px;height:32px;border-radius:9px;background:var(--clay);color:#fff;display:grid;place-items:center}
.send:disabled{background:#E7B7A3;cursor:default}
.dock{padding:8px 0 18px;background:linear-gradient(to bottom,rgba(250,249,245,0),var(--bg) 30%)}
.foot-note{text-align:center;color:var(--faint);font-size:12px;margin-top:8px}

/* popovers */
.pop{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--line2);border-radius:14px;box-shadow:0 12px 40px rgba(31,30,29,.12);padding:6px;z-index:20;max-height:360px;overflow:auto}
.pop.below{bottom:auto;top:calc(100% + 8px)}
.pop-h{padding:6px 10px 4px;font-size:11px;color:var(--faint)}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.opt:hover,.opt.hl{background:var(--stone)}
.opt code{font:500 13px var(--mono);color:var(--ink)}
.opt .d{color:var(--mute);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap}
.who.any{background:var(--sage);color:var(--sage-ink)}
.who.human{background:var(--butter);color:var(--butter-ink)}
.who.read{background:var(--sky);color:var(--sky-ink)}

/* thread */
.thread{padding:18px 0 8px;display:flex;flex-direction:column;gap:22px}
.msg-user{align-self:flex-end;max-width:80%;background:#F0EDE4;border-radius:16px;padding:9px 14px;white-space:pre-wrap;word-break:break-word}
.msg-user.cmd{font-family:var(--mono);font-size:13px}
.msg-bot{display:flex;gap:12px;align-items:flex-start}
.msg-bot .mark{flex-shrink:0;margin-top:2px}
.bot-body{flex:1;min-width:0}
.bot-body p{margin:0 0 8px;font:400 16.5px/1.55 var(--serif);color:var(--ink)}
.bot-body p.small{font:14px/1.5 var(--sans);color:var(--mute)}
.tool{border:1px solid var(--line);border-radius:12px;background:#fff;margin:4px 0 10px;overflow:hidden}
.tool summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.tool summary::-webkit-details-marker{display:none}
.tool summary .caret{margin-left:auto;color:var(--faint);transition:transform .15s}
.tool[open] summary .caret{transform:rotate(180deg)}
.tool pre{margin:0;padding:10px 12px;border-top:1px solid var(--line);background:#FCFBF8;font:12px/1.55 var(--mono);color:var(--ink2);overflow:auto;max-height:320px;white-space:pre-wrap;word-break:break-word}
.res{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:3px 8px;border-radius:7px}
.res.ok{background:var(--sage);color:var(--sage-ink)}
.res.rejected{background:var(--blush);color:var(--blush-ink)}
.res.idempotent_replay{background:var(--sky);color:var(--sky-ink)}
.acts{display:flex;gap:4px;margin-top:2px}
.acts button{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;color:var(--mute);font-size:12.5px}
.acts button:hover{background:var(--stone);color:var(--ink)}

/* ---------- right pane (artifact-style) ---------- */
.pane{width:0;overflow:hidden;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;transition:width .22s ease}
.pane.open{width:min(468px,42vw)}
.pane-in{width:min(468px,42vw);display:flex;flex-direction:column;height:100%}
.pane-head{display:flex;align-items:center;gap:8px;padding:12px 72px 10px 18px;border-bottom:1px solid var(--line)}
.pane-head h2{margin:0;font:500 17px var(--serif)}
.pane-head small{color:var(--mute)}
.tabs{display:flex;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:6px 11px;border-radius:8px;color:var(--mute);font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--stone);color:var(--ink);font-weight:500}
.pane-body{flex:1;overflow:auto;padding:16px 16px 28px;background:var(--bg)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.span{grid-column:1/-1}
.card h4{margin:0 0 2px;font:500 12px var(--sans);color:var(--mute);letter-spacing:.01em}
.big{font:400 32px/1.1 var(--serif);letter-spacing:-.02em}
.delta{font-size:12.5px;color:var(--sage-ink)}
.mid{font:400 22px/1.2 var(--serif)}
.mid small{font:13px var(--sans);color:var(--mute)}
.bar{position:relative;height:8px;border-radius:5px;background:var(--stone);margin:10px 0 6px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#9CBF8B}
.bar i.warn{background:#E1BE5F}.bar i.hot{background:var(--clay)}
.bar .notch{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink2);opacity:.35}
.cap{display:flex;justify-content:space-between;color:var(--faint);font-size:11.5px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px}
.p-sage{background:var(--sage);color:var(--sage-ink)}.p-sky{background:var(--sky);color:var(--sky-ink)}
.p-butter{background:var(--butter);color:var(--butter-ink)}.p-blush{background:var(--blush);color:var(--blush-ink)}
.p-lilac{background:var(--lilac);color:var(--lilac-ink)}.p-stone{background:var(--stone);color:var(--mute);border:1px dashed var(--line2)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row b{font-weight:500}
.pos{font:500 13px var(--mono)}.neg{color:var(--blush-ink)}.gain{color:var(--sage-ink)}
.skip{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.skip span:first-child{color:var(--ink2)}
.skip .track{height:6px;border-radius:4px;background:var(--stone)}
.skip .track i{display:block;height:100%;border-radius:4px;background:#B9A7D8}
.skip span:last-child{text-align:right;color:var(--mute);font-family:var(--mono);font-size:11.5px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.regimes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.rtile.dead{background:repeating-linear-gradient(135deg,#fff 0 8px,#FBFAF6 8px 16px)}
.rtile header{display:flex;justify-content:space-between;align-items:baseline}
.rtile header b{font:500 15px var(--serif)}
.rtile .meta{display:flex;gap:10px;color:var(--mute);font-size:11.5px}
.log{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log div{padding:8px 12px;border-top:1px solid var(--line);font:11.5px/1.55 var(--mono);color:var(--ink2);word-break:break-word}
.log div:first-child{border-top:0}
.log .ts{color:var(--faint)}
.log .ev{color:var(--sky-ink);font-weight:500}
.log .flag{background:#FFFBF0}
.log .flag em{display:inline-block;margin-top:5px;font:500 10.5px var(--sans);font-style:normal;padding:2px 7px;border-radius:6px;background:var(--butter);color:var(--butter-ink)}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sky);color:var(--sky-ink);font-size:12.5px;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:500;color:var(--faint);padding:6px 8px}
.tbl td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.dim{opacity:.55;filter:saturate(.6)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(31,30,29,.28);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(480px,100%);background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(31,30,29,.25);padding:22px;animation:rise .2s ease}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.modal h3{margin:0 0 4px;font:400 24px/1.2 var(--serif)}
.modal .lead{color:var(--mute);margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink2);font-weight:500}
.field input,.field textarea{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:0;background:#FDFCFA}
.field input:focus,.field textarea:focus{border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
.field .hint{font-size:12px;color:var(--faint)}
.field .hint code{font-family:var(--mono);color:var(--ink2);background:var(--stone);padding:1px 5px;border-radius:5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--stone);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{padding:8px;border-radius:9px;color:var(--mute);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,30,29,.1)}
.warnbox{border-radius:12px;background:var(--blush);color:var(--blush-ink);padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.verdict{min-height:26px;margin:-2px 0 12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{padding:9px 16px;border-radius:10px;font-weight:500}
.btn.sec{border:1px solid var(--line2)}
.btn.sec:hover{background:var(--stone)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{background:#000}
.btn.pri.clay{background:var(--clay)}
.linkish{color:var(--clay-d);font-size:12px;text-decoration:underline;text-underline-offset:2px}

/* ---------- throwaway tape ---------- */
.tape{position:fixed;top:14px;right:-38px;transform:rotate(38deg);z-index:60;pointer-events:none;
  background:repeating-linear-gradient(-45deg,#F6E7B4 0 10px,#F2DD98 10px 20px);color:#6A4E0E;
  font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:7px 46px;box-shadow:0 2px 6px rgba(0,0,0,.08);opacity:.95}

/* ---------- responsive ---------- */
.only-narrow{display:none}
@media (max-width:1100px){
  .pane.open{position:fixed;right:0;top:0;bottom:0;width:min(468px,100vw);z-index:40;box-shadow:-20px 0 60px rgba(31,30,29,.12)}
  .pane-in{width:min(468px,100vw)}
}
@media (max-width:780px){
  .app,.app.side-collapsed{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:45;transform:translateX(-100%);transition:transform .2s}
  .app.side-open .side{transform:none;box-shadow:20px 0 60px rgba(31,30,29,.12)}
  .only-narrow{display:grid}
  .only-wide{display:none}
  .bento,.regimes{grid-template-columns:1fr}
  .session span{display:none}
  .column{padding:0 16px}
}
</style>
</head>
<body>
<div class="tape">throwaway · experimental · mock</div>

<div class="app" id="app">
  <!-- sidebar -->
  <aside class="side" id="side">
    <div class="brand">
      <span id="brandMark"></span>
      <b class="hide-c">ACIS</b>
      <span class="tag hide-c">throwaway</span>
      <span class="spacer hide-c"></span>
      <button class="icon-btn only-wide" id="collapse" title="Collapse sidebar" data-i="panelL"></button>
    </div>
    <button class="new-btn" id="newReq"><span class="plus" data-i="plus"></span><span class="hide-c">New request</span></button>
    <nav class="nav" id="nav"></nav>
    <h6 class="hide-c">Recent requests</h6>
    <div class="recents hide-c" id="recents"></div>
    <div class="me hide-c">
      <div class="avatar">O</div>
      <div style="flex:1;min-width:0"><div style="font-weight:500">Owner</div><small id="beatTxt">heartbeat —</small></div>
      <span class="beat" title="C-MCP-6 heartbeat"></span>
    </div>
  </aside>

  <!-- main -->
  <main class="main">
    <div class="topbar">
      <button class="icon-btn only-narrow" id="burger" data-i="menu"></button>
      <button class="session" id="sessionBtn">ACIS <span id="sessionSub"></span></button>
      <span class="spacer"></span>
      <button class="halt-btn" id="haltBtn"><span data-i="stop"></span><span id="haltLbl">Halt</span></button>
      <button class="icon-btn" id="paneBtn" title="Toggle resource pane" data-i="panelR"></button>
    </div>
    <div id="haltedBar"></div>
    <div class="scroll" id="scroll">
      <div class="column">
        <section class="hero" id="hero">
          <div class="hello"><span id="heroMark"></span><h1 id="greet"></h1></div>
          <p class="subline" id="subline"></p>

function mark(size=26){

    petals+=`<rect x="11.1" y="${12-l}" width="1.8" height="${l}" rx=".9" transform="rotate(${a} 12 12)"/>`;}
  return `<svg class="mark" width="${size}" height="${size}" viewBox="0 0 24 24" fill="#D97757">${petals}<circle cx="12" cy="12" r="2.2"/></svg>`;
}

function h(tag,attrs,...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='html') n.innerHTML=v;           // trusted static markup only (icons)
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); }
  return n;
}

/* ---------------- mock ControlTools (mirrors monitoring/tools.py) ---------------- */
function validatePatch(patch){
  if(!patch||typeof patch!=='object'||!Object.keys(patch).length) return 'empty_or_invalid_patch';
  for(const [raw,val] of Object.entries(patch)){
    const p=String(raw).trim(), low=p.toLowerCase();
    if(low.startsWith('guardrail_limits')||low.includes('equity_floor')||Object.hasOwn(GUARD,low)) return `guardrail_path:${p}`;
    if(!Object.hasOwn(ALLOW,p)) return `not_allowlisted:${p}`;
    const n=typeof val==='number'?val:Number(val);
    if(typeof val==='boolean'||val===''||!Number.isFinite(n)) return `non_finite_value:${p}`;
    const [lo,hi]=ALLOW[p]; if(n<lo||n>hi) return `out_of_bounds:${p}:[${lo},${hi}]`;
  }
  return null;
}
function dispatch(name,req){
  const a=req.args||{}, tok=req.human_token, human=TOOLS[name].who==='human';
  if(human && tok!==MOCK_TOKEN) return ['rejected:auth',false];
  switch(name){
    case 'acis_halt': { const scope=String(a.scope||'all'); S.halted={scope,reason:String(a.reason||'mcp_halt'),at:nowISO()}; return [`ok:halted:${scope}`,false]; }
    case 'acis_flatten': { S.positions=[]; return ['ok:flattened',false]; }
    case 'acis_resume': { S.halted=null; return ['ok:resumed',true]; }
    case 'acis_set_mode': {
      const m=a.mode; if(!['backtest','paper','live'].includes(m)) return [`rejected:bad_mode:${m}`,true];
      if(m==='live'){
        if(a.guardrail_hash!==GUARD_HASH) return ['rejected:guardrail_hash_not_acknowledged',true];
        if(a.rulebook_hash!==RULEBOOK_HASH) return ['rejected:rulebook_hash_not_acknowledged',true];
        return ['rejected:live_gate_closed:§14_oos_minimums_and_owner_signoff_pending',true];
      }
      S.mode=m; return [`ok:mode:${m}`,true];
    }
    case 'acis_stage_config': {
      const why=validatePatch(a.patch); if(why) return [`rejected:${why}`,false];
      const id='stg_'+Math.random().toString(36).slice(2,7);
      S.staged.push({id,patch:a.patch,rationale:a.rationale||'',at:nowISO()}); return [`ok:staged:${id}`,false];
    }
    case 'acis_run_backtest': return [`ok:bt_${Math.random().toString(36).slice(2,6)}:queued:walk_forward:${a.window||'2012-2025'}`,false];
    case 'acis_report': return [`ok:report:${a.period||'daily'}:${new Date().toISOString().slice(0,10)}`,false];
  }
  return [`rejected:unhandled:${name}`,false];
}
function callTool(name,req,caller='owner-console'){
  if(!TOOLS[name]) return {status:'rejected',reason:`unknown_tool:${name}`};
  const id=req.request_id; if(typeof id!=='string'||!id.trim()) return {status:'rejected',reason:'missing_request_id'};
  const prior=S.audit.get(id);
  if(prior) return {status:'idempotent_replay',result:prior.result,request_id:id};
  const [result,isHuman]=dispatch(name,req);
  if(!result.startsWith('rejected:'))  // pure rejections are not cached → a retry with the same id is allowed
    S.audit.set(id,{request_id:id,tool:name,caller,is_human:isHuman,args:req.args||{},result,at:nowISO()});
  return {status:result.startsWith('ok')?'ok':'rejected',result,request_id:id};
}

/* ---------------- slash menu & resource popover ---------------- */
let pop=null, hl=0, popItems=[];
function closePop(){ if(pop){pop.remove();pop=null;} }
function updateSlash(){
  const v=input.value;
  if(!/^\/\S*$/.test(v)){ if(pop&&pop.dataset.kind==='slash') closePop(); return; }
  const q=v.slice(1).toLowerCase();
  const items=Object.entries(TOOLS).filter(([n,t])=>t.cmd.startsWith(q));
  items.push(...(('read'.startsWith(q))?[['read',{cmd:'read',who:'read',d:'Read an acis:// resource.'}]]:[]));
  closePop(); if(!items.length) return;
  hl=Math.min(hl,items.length-1); popItems=items;
  pop=h('div',{class:'pop'+(threadEl.hidden?' below':''),'data-kind':'slash'},
    h('div',{class:'pop-h'},'Tools — mirrors the MCP control plane'),
    items.map(([n,t],k)=>h('button',{class:'opt'+(k===hl?' hl':''),onmousedown:(e)=>{e.preventDefault();pickSlash(k);}},
      h('code',{},'/'+t.cmd), h('span',{class:'d'},t.d),
      h('span',{class:'who '+t.who}, t.who==='any'?'any agent':t.who==='human'?'human token':'read-only'))));
  composerEl.append(pop);
}
function pickSlash(k){
  const [,t]=popItems[k]; input.value='/'+t.cmd+' '; closePop(); input.focus(); sendBtn.disabled=false;
  if(['halt','flatten','resume','backtest','report'].includes(t.cmd)) submit();
}
function toggleResPop(){
  if(pop&&pop.dataset.kind==='res'){closePop();return;}
  closePop();
  pop=h('div',{class:'pop'+(threadEl.hidden?' below':''),'data-kind':'res'},
    h('div',{class:'pop-h'},'Read-only resources'),
    RESOURCES.map(u=>h('button',{class:'opt',onmousedown:(e)=>{e.preventDefault();closePop();runRead(u);}},
      h('code',{},u), h('span',{class:'d'}), h('span',{class:'who read'},'read'))));
  composerEl.append(pop);
}
document.addEventListener('mousedown',(e)=>{ if(pop&&!composerEl.contains(e.target)) closePop(); });

function onKey(e){
  if(pop&&pop.dataset.kind==='slash'){
    if(e.key==='ArrowDown'){e.preventDefault();hl=(hl+1)%popItems.length;updateSlash();return;}
    if(e.key==='ArrowUp'){e.preventDefault();hl=(hl-1+popItems.length)%popItems.length;updateSlash();return;}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickSlash(hl);return;}
  }
  if(e.key==='Escape') closePop();
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}
}

/* ---------------- command routing ---------------- */
function submit(){
  const raw=input.value.trim(); if(!raw) return;
  closePop(); input.value=''; autosize(); sendBtn.disabled=true;
  if(raw.startsWith('acis://')) return runRead(raw.split(/\s+/)[0]);
  if(!raw.startsWith('/')) return freeText(raw);
  const [cmd,...rest]=raw.slice(1).split(/\s+/); const tail=rest.join(' ');
  switch(cmd){
    case 'halt': { const scope=INSTR.includes((rest[0]||'').toUpperCase())?rest.shift().toUpperCase():'all';
      return runTool('acis_halt',{scope,reason:rest.join(' ')||'owner_console'},raw); }
    case 'flatten': return runTool('acis_flatten',{reason:tail||'owner_console'},raw);
    case 'resume': return openToken('acis_resume',{},raw);
    case 'mode': return ['backtest','paper','live'].includes(rest[0])? openMode(rest[0]) : openMode();
    case 'stage': {
      const patch={}, words=[];
      rest.forEach(w=>{const m=w.match(/^([^=]+)=(.+)$/); if(m) patch[m[1]]=isNaN(+m[2])?m[2]:+m[2]; else words.push(w);});
      return Object.keys(patch).length? runTool('acis_stage_config',{patch,rationale:words.join(' ')},raw) : openStage();
    }
    case 'backtest': return runTool('acis_run_backtest',{window:rest[0]||'2012-2025'},raw);
    case 'report': return runTool('acis_report',{period:rest[0]||'daily'},raw);
    case 'read': return runRead(rest[0]||'acis://status');
    default: return freeText(raw,true);
  }
}

/* ---------------- thread rendering ---------------- */
function addUser(text,isCmd=true){
  toThreadLayout();
  threadEl.append(h('div',{class:'msg-user'+(isCmd?' cmd':'')},text));
}
function addBot(...kids){
  const body=h('div',{class:'bot-body'},...kids);
  const n=h('div',{class:'msg-bot'},h('span',{html:mark(24)}),body);
  threadEl.append(n); requestAnimationFrame(()=>$('#scroll').scrollTo({top:1e9,behavior:'smooth'}));
  return body;
}
function toolBlock(label,who,payload,open=false){
  return h('details',{class:'tool',open},
    h('summary',{},icon('tool'),h('span',{},label),h('span',{class:'who '+who},who==='any'?'any agent':who==='human'?'human token':'read-only'),h('span',{class:'caret',html:I.chev})),
    h('pre',{},JSON.stringify(payload,null,2)));
}
const NARR={
  acis_halt:(r)=>r.startsWith('ok')?'Halted. New entries are blocked; open positions keep their venue-side stops. Halts are cheap — resuming needs a human.':null,
  acis_flatten:(r)=>r.startsWith('ok')?'Flattened. Every position is closed; the book is empty.':null,
  acis_resume:(r)=>r.startsWith('ok')?'Resumed with a verified human token. The Governor re-checks it on its side too.':null,
  acis_set_mode:(r)=>r.includes('live_gate_closed')?'Both hashes acknowledged — and still refused. Live needs the §14 minimums out-of-sample plus your sign-off, and this console will never flip it.':r.startsWith('ok')?`Mode is now ${S.mode}.`:null,
  acis_stage_config:(r)=>r.startsWith('ok')?'Staged. It waits in the pending set and promotes at the next session boundary — never mid-session.':null,
  acis_run_backtest:(r)=>'Queued. Results come back as out-of-sample folds; in-sample numbers are never graded against §14.',
  acis_report:(r)=>'Report built from the daily rollup.',
};
const REJ={auth:'No valid human token, so nothing happened. Only a human can resume or change mode.',
  guardrail_path:'Refused at the schema. Guardrails and the equity floor cannot be reached from here — that is what makes them guards.',
  not_allowlisted:'That path is not in the human-committed allowlist, so it cannot be staged.',
  out_of_bounds:'The value falls outside the declared bounds for that tunable.',
  non_finite_value:'The value must be a finite number.',
  guardrail_hash_not_acknowledged:'Live needs you to acknowledge the current guardrail hash.',
  rulebook_hash_not_acknowledged:'Live also needs the account rulebook hash.',
  bad_mode:'Mode must be backtest, paper or live.'};
function narrate(name,out){
  if(out.status==='idempotent_replay') return `Same request_id as before, so nothing ran again — this is the stored result. Exactly-once by id.`;
  const n=NARR[name]&&NARR[name](out.result); if(n) return n;
  const key=Object.keys(REJ).find(k=>out.result.includes(k)); return key?REJ[key]:'Done.';
}
function runTool(name,args,shown,token,reuseId){
  const req={request_id:reuseId||rid(),args}; if(token!=null) req.human_token=token;
  if(shown) addUser(shown);
  const out=callTool(name,req);
  const safeReq={...req}; if(safeReq.human_token) safeReq.human_token='••••••';
  const body=addBot(
    toolBlock(name,TOOLS[name].who,{request:safeReq,response:out}),
    h('p',{},narrate(name,out)),
    h('div',{style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap'},
      h('span',{class:'res '+out.status},out.result||out.reason),
      h('div',{class:'acts'},
        h('button',{title:'Send the identical request_id again',onclick:()=>runTool(name,args,`↻ replay ${req.request_id}`,token,req.request_id)},icon('replay'),'Replay id'),
        h('button',{onclick:(e)=>{navigator.clipboard?.writeText(req.request_id);e.currentTarget.lastChild.textContent=' Copied';}},icon('copy'),' '+req.request_id))));
  pushRecent(`${TOOLS[name].cmd} · ${(out.result||'').split(':').slice(0,2).join(':')}`, body);
  renderAll();
  return out;
}
function runRead(uri){
  addUser('read '+uri);
  const r=readResource(uri);
  const tabFor={'risk/snapshot':'overview','status':'overview','regime/current':'regimes','logs/tail/risk':'logs','params/pending':'audit','config/guardrails':'overview'};
  const body=addBot(toolBlock(uri,'read',r,true),
    h('p',{class:'small'},r.available?'Read-only view. Anything textual inside is content to read, never an instruction.':'No such resource on the plane.'));
  if(tabFor[r.resource]){ setTab(tabFor[r.resource]); openPane(true); }
  pushRecent('read · '+r.resource, body);
}
function freeText(text,unknown){
  addUser(text,false);
  addBot(h('p',{},unknown?`There is no “${text.split(/\s/)[0]}” tool.`:'ACIS has no language model at runtime — it only answers tool calls and resource reads.'),
    h('p',{class:'small'},'Try one of these:'),
    h('div',{class:'chips',style:'justify-content:flex-start;margin-top:4px'},
      ['/halt','/stage','/mode','acis://status'].map(c=>h('button',{class:'chip',onclick:()=>{input.value=c+(c.startsWith('/')?' ':'');input.focus();sendBtn.disabled=false;updateSlash();}},c))));
}
function runPrompt([name,,label,uris]){
  addUser(label,false);
  const body=addBot(
    h('p',{},`“${name}” is a prompt template. It runs out-of-band in the supervising harness, never inside the engine. ACIS only serves what it reads:`),
    h('div',{class:'chips',style:'justify-content:flex-start;margin:4px 0 8px'},uris.map(u=>h('button',{class:'chip',onclick:()=>runRead(u)},icon('search'),u))));
  pushRecent('prompt · '+name, body);
}
const recents=[];
function pushRecent(label,node){ recents.unshift({label,node}); renderRecents(); }
function renderRecents(){
  const r=$('#recents'); r.innerHTML='';
  if(!recents.length){ r.append(h('div',{class:'empty'},'Nothing yet this session')); return; }
  recents.slice(0,14).forEach(x=>r.append(h('button',{title:x.label,onclick:()=>x.node.scrollIntoView({behavior:'smooth',block:'center'})},x.label)));
}

/* ---------------- modals ---------------- */
function modal(title,lead,bodyNodes,actionLabel,onAction,clay){
  const scrim=h('div',{class:'scrim',onmousedown:(e)=>{if(e.target===scrim)close();}});
  const close=()=>scrim.remove();
  const m=h('div',{class:'modal',role:'dialog','aria-modal':'true'},
    h('h3',{},title), h('p',{class:'lead'},lead), ...bodyNodes,
    h('div',{class:'modal-actions'},h('button',{class:'btn sec',onclick:close},'Cancel'),
      h('button',{class:'btn pri'+(clay?' clay':''),onclick:()=>{ if(onAction()!==false) close(); }},actionLabel)));
  scrim.append(m); document.body.append(scrim);
  scrim.addEventListener('keydown',(e)=>{ if(e.key==='Escape') close(); if(e.key==='Enter'&&e.target.tagName==='INPUT'){ e.preventDefault(); m.querySelector('.btn.pri').click(); }});
  setTimeout(()=>m.querySelector('input')?.focus(),30);
}
function tokenField(){
  const inp=h('input',{type:'password',placeholder:'Paste your human token',autocomplete:'off'});
  return [inp, h('div',{class:'field'},h('label',{},'Human token'),inp,
    h('div',{class:'hint'},'Mock token is ',h('code',{},MOCK_TOKEN),'. The real verifier is a hashed, constant-time check (C-MCP-10).'))];
}
function openToken(tool,args,shown){
  const [inp,field]=tokenField();
  modal(tool==='acis_resume'?'Resume trading':'Change mode',
    'Resuming raises activity, so it is human-only. Agents may halt; they can never resume.',
    [field],'Resume',()=>runTool(tool,args,shown||'/resume',inp.value));
}
function openMode(pre){
  let sel=pre||S.mode;
  const [tok,tokField]=tokenField();
  const gh=h('input',{placeholder:'sha256:…'}), rh=h('input',{placeholder:'sha256:…'});
  const liveBox=h('div',{},
    h('div',{class:'warnbox'},'Live requires the §14 minimums met out-of-sample and your explicit sign-off. This console refuses live regardless — it only shows you the gate.'),
    h('div',{class:'field'},h('label',{},'Acknowledge guardrail hash'),gh,h('div',{class:'hint'},'Current: ',h('code',{},GUARD_HASH),' ',h('button',{class:'linkish',onclick:()=>gh.value=GUARD_HASH},'use'))),
    h('div',{class:'field'},h('label',{},'Acknowledge rulebook hash'),rh,h('div',{class:'hint'},'Current: ',h('code',{},RULEBOOK_HASH),' ',h('button',{class:'linkish',onclick:()=>rh.value=RULEBOOK_HASH},'use'))));
  const seg=h('div',{class:'seg'});
  const paint=()=>{ seg.innerHTML=''; ['backtest','paper','live'].forEach(m=>seg.append(h('button',{class:m===sel?'on':'',onclick:()=>{sel=m;paint();}},m[0].toUpperCase()+m.slice(1)))); liveBox.hidden=sel!=='live'; };
  paint();
  modal('Set mode',`Currently ${S.mode}. Changing mode needs a human token.`,[seg,liveBox,tokField],'Apply',()=>{
    const args={mode:sel}; if(sel==='live'){args.guardrail_hash=gh.value.trim();args.rulebook_hash=rh.value.trim();}
    runTool('acis_set_mode',args,'/mode '+sel,tok.value);
  });
}
function openStage(){
  const path=h('input',{list:'allowlist',placeholder:'agon.discard_threshold'}), val=h('input',{placeholder:'0.55',inputmode:'decimal'}),
        why=h('textarea',{rows:2,placeholder:'Why — shown to the reviewer at promotion'});
  const dl=h('datalist',{id:'allowlist'},Object.keys(ALLOW).map(k=>h('option',{value:k})));
  const verdict=h('div',{class:'verdict'});
  const check=()=>{
    verdict.innerHTML='';
    if(!path.value.trim()) { verdict.append(h('span',{class:'note'},'Try a guardrail path like daily_drawdown_pct — watch it bounce.')); return; }
    const why_=validatePatch({[path.value]:val.value});
    const b=ALLOW[path.value.trim()];
    verdict.append(why_? h('span',{class:'res rejected'},'will reject · '+why_) : h('span',{class:'res ok'},'valid · bounds ['+b.join(', ')+']'));
  };
  path.addEventListener('input',check); val.addEventListener('input',check); check();
  modal('Stage a tunable','Any agent may stage. Nothing changes until the next session boundary, and guardrails are unreachable by construction.',
    [dl,h('div',{class:'field'},h('label',{},'Path'),path),h('div',{class:'field'},h('label',{},'Value'),val),h('div',{class:'field'},h('label',{},'Rationale'),why),verdict],
    'Stage',()=>{ const p=path.value.trim(); const v=val.value.trim();
      runTool('acis_stage_config',{patch:{[p]:v===''?v:(isNaN(+v)?v:+v)},rationale:why.value},`/stage ${p}=${v}`); });
}

/* ---------------- pane ---------------- */
let tab='overview';
const TABS=[['overview','Overview','acis://risk/snapshot'],['regimes','Regimes','acis://regime/current'],['logs','Logs','acis://logs/tail/risk'],['audit','Audit','mcp_audit']];
function setTab(t){tab=t;renderPane();}
function openPane(force){ const p=$('#pane'); const on=force??!p.classList.contains('open'); p.classList.toggle('open',on); }
function gauge(label,val,cap,{notches,unit='%',foot}={}){
  const f=val/cap, cls=f>=.8?'hot':f>=.6?'warn':'';
  return h('div',{class:'card'},h('h4',{},label),
    h('div',{class:'mid'},val.toFixed(2)+unit,' ',h('small',{},'of '+cap+unit)),
    h('div',{class:'bar'},h('i',{class:cls,style:`width:${Math.min(100,f*100)}%`}),(notches||[]).map(n=>h('span',{class:'notch',style:`left:${n*100}%`,title:`${n*100}% of cap`}))),
    h('div',{class:'cap'},h('span',{},foot||''),h('span',{},Math.round(f*100)+'% used')));
}
function sparkSVG(){
  const W=400,H=92,min=Math.min(GUARD.equity_floor_usd-80,...series),max=Math.max(...series)+30;
  const x=k=>k/(series.length-1)*W, y=v=>H-(v-min)/(max-min)*H;
  const d=series.map((v,k)=>(k?'L':'M')+x(k).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const fy=y(GUARD.equity_floor_usd);
  return `<svg viewBox="0 0 ${W} ${H+14}" width="100%" height="106" preserveAspectRatio="none" style="margin-top:8px;overflow:visible">
   <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D97757" stop-opacity=".22"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></linearGradient></defs>
   <path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#g)"/>
   <path d="${d}" fill="none" stroke="#D97757" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
   <line x1="0" x2="${W}" y1="${fy}" y2="${fy}" stroke="#44433F" stroke-opacity=".45" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
   <text x="0" y="${fy+12}" font-size="10" fill="#7C7A71" font-family="Inter,sans-serif">equity floor $9,000 · human-owned</text></svg>`;
}
const regimeTone=(r)=>DAGGER.has(r)?'p-stone':r.includes('TREND_UP')?'p-sage':r.includes('TREND_DOWN')?'p-blush':r.startsWith('RANGING')?'p-sky':r.includes('BREAKOUT')?'p-butter':'p-lilac';
function renderPane(){
  const t=TABS.find(x=>x[0]===tab);

  const halted=S.halted?h('div',{class:'callout',style:'background:var(--clay-soft);color:var(--blush-ink)'},icon('stop'),h('span',{},'Halted ('+S.halted.scope+'). Entries blocked. Figures below are frozen.')):null;
  if(tab==='overview'){
    const dayPnl=S.equity-S.start, fr=S.dd/GUARD.daily_drawdown_pct;
    const state=fr>=GUARD.entry_halt_fraction?['Entry halt','p-blush']:fr>=GUARD.taper_start_fraction?['Tapering','p-butter']:['Full size','p-sage'];
    b.append(halted||'', h('div',{class:'bento'+(S.halted?' dim':'')},
      h('div',{class:'card span'},
        h('div',{style:'display:flex;justify-content:space-between;align-items:flex-start'},
          h('div',{},h('h4',{},'Paper equity'),h('div',{class:'big'},fmt$(S.equity)),h('div',{class:'delta'},(dayPnl>=0?'+':'')+fmt$(dayPnl).replace('$-','−$')+' since start · '+((dayPnl/S.start)*100).toFixed(2)+'%')),
          h('span',{class:'pill '+state[1]},state[0])),
        h('div',{html:sparkSVG()})),
      gauge('Daily drawdown',S.dd,GUARD.daily_drawdown_pct,{notches:[.6,.8],foot:'taper 60 · halt 80'}),
      gauge('1-day VaR',S.var,GUARD.var_cap_pct,{foot:'99% · Kupiec-tallied'}),
      gauge('Largest currency delta',S.ccy[0][1],GUARD.single_currency_delta_cap_pct,{foot:S.ccy[0][0]}),
      gauge('Cluster exposure',S.cluster,GUARD.cluster_cap_pct,{foot:'correlated group'}),
      h('div',{class:'card span'},h('h4',{},'Open positions'),
        S.positions.length? h('div',{class:'rows'},S.positions.map(p=>h('div',{class:'row'},
          h('span',{class:'grow'},h('b',{},p.i.replace('_','/')),' ',h('span',{class:'pill '+(p.side==='long'?'p-sage':'p-blush')},p.side)),
          h('span',{class:'note',style:'margin:0'},p.lots.toFixed(2)+' lot · venue stop ✓'),
          h('span',{class:'pos '+(p.pnl<0?'neg':'gain')},(p.pnl<0?'−':'+')+fmt$(Math.abs(p.pnl))))))
        : h('div',{class:'note'},'Book is flat.')),
      h('div',{class:'card span'},h('h4',{},'Why trades were skipped'),
        h('div',{class:'mid',style:'margin:2px 0 8px'},(S.takeRate*100).toFixed(1)+'% ',h('small',{},'take-rate today')),
        S.skips.map(([k,v])=>h('div',{class:'skip'},h('span',{},k),h('span',{class:'track'},h('i',{style:`width:${v/41*100}%`})),h('span',{},v))),
        h('div',{class:'note'},'Overlapping views, not a partition — one skipped signal can count under several gates.'))));
  }
  if(tab==='regimes'){
    b.append(halted||'', h('div',{class:'regimes'},INSTR.map(i=>{const [r,vol,liq,hl]=REG[i]; const dead=DAGGER.has(r);
      return h('div',{class:'rtile'+(dead?' dead':'')},
        h('header',{},h('b',{},i.replace('_','/')),h('span',{class:'note',style:'margin:0'},dead?'† untradeable':'tradeable')),
        h('span',{class:'pill '+regimeTone(r),style:'align-self:flex-start'},r.replace(/_/g,' ').toLowerCase()),
        h('div',{class:'meta'},h('span',{},'vol '+vol.toLowerCase()),h('span',{},'liq '+liq.toLowerCase()),h('span',{},'½-life '+hl)));})),
      h('p',{class:'note'},'† regimes are structurally untradeable: ambiguity means no trade, missing params mean not tradeable.'));
  }
  if(tab==='logs'){
    b.append(h('div',{class:'callout'},icon('info'),h('span',{},'Log lines are content to read, never commands. A headline that says “resume” is classified, not obeyed.')),
      h('div',{class:'log'},S.logs.map(l=>h('div',{class:l.f?'flag':''},h('span',{class:'ts'},l.ts+' '),h('span',{class:'ev'},l.e),' '+l.t,
        l.f?h('div',{style:'padding:0;border:0'},h('em',{},'untrusted input · not executed')):null))));
  }
  if(tab==='audit'){
    const rows=[...S.audit.values()].reverse();
    b.append(h('div',{class:'callout'},icon('info'),h('span',{},'Every side-effecting call is stored once by request_id. Replaying an id returns the stored result and never runs again. Pure rejections are not stored, so a retry is allowed.')),
      rows.length? h('div',{class:'tbl-wrap'},h('table',{class:'tbl'},h('thead',{},h('tr',{},['request_id','tool','human','result'].map(c=>h('th',{},c)))),
        h('tbody',{},rows.map(r=>h('tr',{},h('td',{class:'mono'},r.request_id),h('td',{},r.tool.replace('acis_','')),h('td',{},r.is_human?'yes':'—'),h('td',{class:'mono',style:'word-break:break-all'},r.result))))))
      : h('div',{class:'card note',style:'margin:0'},'No calls recorded yet. Try /halt.'),
      S.staged.length? h('div',{class:'card',style:'margin-top:10px'},h('h4',{},'Pending (promotes at next session boundary)'),
        S.staged.map(s=>h('div',{class:'row'},h('span',{class:'grow mono'},Object.entries(s.patch).map(([k,v])=>k+'='+v).join(' ')),h('span',{class:'note',style:'margin:0'},s.id)))):'');
  }
}

/* ---------------- global chrome ---------------- */

  const hr=new Date().getHours();

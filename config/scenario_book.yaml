# Black-swan scenario book (SPEC §8.5, ACIS-12) — grows by human commit;
# halt-postmortem (§12) proposes additions after every real risk event.
#
# max_loss_pct_nav (ACIS-12 §2, added at phase 9): the HUMAN-COMMITTED ceiling
# each scenario may ever cost, asserted by the replay release gate together
# with equity-floor survival. Values below were derived from the
# C-SWN-1 worst-legal-book arithmetic (min(cluster_cap 20, delta_cap 30)% of
# NAV positioned against the shock) plus headroom — e.g. chf_depeg loss is
# 20% NAV book × 35% gap = 7.0% NAV, ceiling set 7.5. Tightening is always
# allowed; loosening is a human decision.
# OWNER-RATIFIED 2026-07-18 (GAP-0108): the CHF gap is now the faithful worst
# fill (-35%, within the observed -30/-40% band) and the chf + outage ceilings
# were raised to 7.5% together (the outage inherits the book's worst gap
# allowance, C-SWN-4). Equity-floor survival + a green replay gate were
# confirmed before commit. The single_currency_delta_cap veto-flag precedent
# stood for the phase-9 provisional values; these are now owner-committed.
# ref_price (liquidity_vacuum, C-SWN-5): converts worst notional to units.
scenarios:
  - name: chf_depeg_2015
    # GAP-0108 RESOLVED (owner-ratified 2026-07-18): the gap is now the faithful
    # worst fill. On 2015-01-15 USD/CHF fell ~-27% intraday with retail stops
    # filling as deep as ~-40%; -35% sits inside the observed -30/-40% band (the
    # honest worst-legal-book cost, not the daily close). At the 20% clustered
    # worst book this is 7.0% NAV; the ceiling was raised to 7.5% (C-SWN-7,
    # human-commit). The outage-allowance-source refinement (borrow only the
    # worst ENABLED-instrument gap rather than any book scenario) was DELIVERED
    # in phase 11 (ACIS-09 §6); per-account-universe keying is deferred to
    # phase 12 (GAP-P11I-10). The static 7.5 below is the conservative fallback.
    kind: gap_through_stop
    description: SNB floor removal 2015-01-15 — USD/CHF gap ~-35% through all stops (worst fill).
    params: {instrument: USD_CHF, gap_pct: -35.0}
    max_loss_pct_nav: 7.5
  - name: flash_crash_2010
    kind: flash_crash
    description: 2010-05-06 style liquidity vacuum with V-recovery.
    params: {instrument: EUR_USD, drop_pct: -6.0, recovery_s: 900}
    max_loss_pct_nav: 1.5
  - name: weekend_war_gap
    kind: gap_through_stop
    description: Hostilities open over a weekend; Sunday open gaps through stops.
    params: {instrument: XAU_USD, gap_pct: 5.0}
    max_loss_pct_nav: 1.5
  - name: broker_outage_mid_position
    kind: broker_outage
    description: Feed and order channel lost with open positions for 10 minutes.
    params: {duration_s: 600}   # no instrument = worst across enabled (C-SWN-4)
    max_loss_pct_nav: 7.5      # stop geometry + the book's worst gap allowance
                               # (now the faithful -35% CHF gap, GAP-0108);
                               # raised with the chf ceiling, owner-ratified
                               # 2026-07-18. Outage-allowance-source refinement
                               # (enabled-only worst gap) DELIVERED phase 11
                               # (ACIS-09 §6); per-account keying → phase 12
                               # (GAP-P11I-10).
  - name: rollover_liquidity_vacuum
    kind: liquidity_vacuum
    description: Spread explosion at the 17:00 New York rollover (21:00 UTC summer / 22:00 winter), 50x normal spread.
    params: {instrument: EUR_USD, spread_mult: 50, ref_price: 1.10}
    max_loss_pct_nav: 1.0

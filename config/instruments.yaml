# §5.5: every relationship declares its window AND method — schema-fatal otherwise.
pair_relationships:
  eurusd_usdjpy:
    legs: [EUR_USD, USD_JPY]
    expected_sign: -1          # USD on opposite sides — historically opposite movers
    correlation_window: 50
    method: pearson_log_returns
    stability_floor: 0.40
    zscore_window: 50

clusters:
  # USD_CHF is a USD-base pair — it belongs in the long-USD cluster. Membership
  # bounds its worst legal book by the 20% cluster cap (GAP-P9I-02: a
  # cluster-less instrument would be bounded only by the 30% delta cap, which
  # the §8.5 chf_depeg scenario's worst-book construction must reflect honestly).
  usd_long: [USD_JPY, USD_CHF, USD_CAD]
  usd_short: [EUR_USD, GBP_USD, AUD_USD]
  commodity: [XAU_USD, AUD_USD]     # C7: extension references inert while disabled
  european: [EUR_USD, GBP_USD, EUR_GBP, EUR_CHF, EUR_AUD]   # EUR/GBP bloc — gives each cross a cluster
  yen_carry: [USD_JPY, EUR_JPY, GBP_JPY, AUD_JPY, CHF_JPY]  # long = short JPY (R1.6: every cross has one)
  risk_on: [EUR_USD]
  risk_off: [XAU_USD, USD_JPY]

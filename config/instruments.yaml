# Instrument universe + §3.7 contract metadata + market calendars + clusters.
# The enabled set is per-account; extension instruments may be declared disabled
# and referenced by clusters (C7: inert until enabled; unknown symbol = error).
calendars:
  # All times are LOCAL wall time in the named centre; fx_clock resolves them to UTC
  # per date, so they track DST (GAP-P12D-10). Never declare a fixed-UTC market time.
  fx_default:
    type: fx
    sessions:                    # GAP-0023: sydney = New York close → Tokyo open (no dead window)
      sydney: {zone: America/New_York, open: "17:00", close: "09:00", close_zone: Asia/Tokyo}
      tokyo: {zone: Asia/Tokyo, open: "09:00", close: "18:00"}
      london: {zone: Europe/London, open: "08:00", close: "17:00"}
      new_york: {zone: America/New_York, open: "08:00", close: "17:00"}
    week_close: {zone: America/New_York, at: "17:00"}   # Friday = the rollover
    week_open: {zone: America/New_York, at: "17:00"}    # Sunday
    # Audit X5: whole-day FX closures (interbank convention; FTMO's 2025 holiday table,
    # "Forex & Exotics ... Closed" on Dec 25 and Jan 1). Each closes the trading day that
    # ends at 17:00 New York on that date. RE-VERIFY against the firm's table each December.
    holidays: ["2025-12-25", "2026-01-01", "2026-12-25", "2027-01-01"]
  spot_metals:                   # GAP-P12D-11: OTC spot gold — 24/5 with a daily hour off
    type: fx
    sessions:
      sydney: {zone: America/New_York, open: "17:00", close: "09:00", close_zone: Asia/Tokyo}
      tokyo: {zone: Asia/Tokyo, open: "09:00", close: "18:00"}
      london: {zone: Europe/London, open: "08:00", close: "17:00"}
      new_york: {zone: America/New_York, open: "08:00", close: "17:00"}
    week_close: {zone: America/New_York, at: "17:00"}   # Friday
    week_open: {zone: America/New_York, at: "18:00"}    # Sunday, an hour after FX
    daily_break: {zone: America/New_York, open: "17:00", close: "18:00"}
  cme_metals:
    type: exchange
    zone: America/Chicago        # CME runs on Chicago time
    open: "08:30"
    close: "15:00"
    days: [1, 2, 3, 4, 5]
    holidays: ["2026-12-25", "2026-07-03"]
    half_days:
      "2026-11-27": "11:00"

instruments:
  EUR_USD:
    enabled: true
    asset_class: fx
    base_ccy: EUR
    quote_ccy: USD
    tick_size: 0.00001
    tick_value: 1.0
    lot_step: 0.01
    min_lot: 0.01
    margin_model: retail_fx
    swap_convention: tom_next
    max_plausible_spread: 0.0005
    calendar: fx_default
    costs:                   # C8 friction, price units; phase-11 OANDA calibration
      commission_per_side: 0.0
      slippage_per_side: 0.00002
    vol_target_atr_frac: 0.0008   # C16 declared target (ACIS-05 §6.2)
  USD_JPY:

# ACIS system config (SPEC §9). Dev/paper defaults — human-committed.
mode: paper
base_unit_usd: 1000.0
active_account: dev_paper
# C1: the single source of truth for forex session boundaries — LOCAL wall times,
# resolved to UTC per date by fx_clock (GAP-P12D-10): the rollover (= the Sydney
# open, GAP-0023), then each open.
session_boundaries:
  - {zone: America/New_York, at: "17:00"}
  - {zone: Asia/Tokyo, at: "09:00"}
  - {zone: Europe/London, at: "08:00"}
  - {zone: America/New_York, at: "08:00"}
param_stall_alert_boundaries: 3
regime:
  cycle_seconds: 120
  atr_periods: [14, 50, 200]
  adx_period: 14
  adx_strong: 25.0
  adx_weak: 20.0
  bb_window: 100
  bb_squeeze_pct: 0.10
  bb_release_pct: 0.85
  hurst_window: 200
  # GAP-0070 (owner-ratified 2026-07-17): hurst_trend removed (drift-invariant
  # statistic - no trend meaning); hurst_meanrev re-derived against the
  # repaired Anis-Lloyd multi-window estimator (was 0.45 on the biased 4-point
  # fit): random-walk false-positive 7.5%, OU kappa>=0.2 detection 95-100%.
  hurst_meanrev: 0.35
  confidence_veto: 0.55
  spread_veto_mult: 3.0
  velocity_veto_mult: 0.5
  vol_medium_ratio: 0.8
  vol_high_ratio: 1.3
  vol_extreme_ratio: 2.0
  spread_illiquid_sigma: 2.0
  stability_window: 20
signals:
  signal_bar_seconds: 60      # v2.11: THE declared time base (= the GAP-0009 scalp bar)
  atr_period: 14
  tsmom_disaster_stop_atr: 10.0  # safety-only far stop (declared deviation from published TSMOM)
  conviction_discard: 0.45
  medium_vol_discount: 0.85
  valid_for_seconds:
    TREND: 300
    BREAKOUT: 120
    MEAN_REVERSION: 300
    MOMENTUM_SCALP: 30
    PAIR_DIVERGENCE: 300
    TSMOM: 86400
  momentum_scalp_horizon_bars: [5, 15]
  momentum_scalp_bar_seconds: 60   # GAP-0009 ruling: the scalp bar is the 1-minute bar
  momentum_scalp_surge_ratio: 1.5
  fast_loop_decision_budget_ms: 250  # GAP-0007 value (ACIS-04 §6)
  tsmom_lookback_days: [63, 126, 252]
  tsmom_min_history_days: 260
  modules_enabled:
    TREND: true
    BREAKOUT: true
    MEAN_REVERSION: true
    MOMENTUM_SCALP: true
    PAIR_DIVERGENCE: true
    TSMOM: true
provenance:
  revalidation_cadence_days: 90
  challenger_comparison_window_days: 60
optimizer:
  population_size: 20
  generations: 30
  qbit_resolution: 8
  rotation_angle_rad: 0.05
  qiea_cycle_seconds: 14400
  fitness_span_days: 730   # master §5 v2.18 (GAP-P12D-29): every target-regime bar in this recency span; = the ratified 2-yr walk-forward train window
  fitness_min_bars: 300
  fitness_min_trades: 10
  holdout_fraction: 0.20
  holdout_min_trades: 5
  expectancy_min_r: 0.0
data:
  stale_threshold_ms: 2500
  clock_skew_tolerance_ms: 1500
  reorder_tolerance_ms: 500
  tick_velocity_window_s: 10.0
  queue_max: 1000
  queue_overflow_policy: drop_oldest
  macro_lookahead_min: 30
  calendar_stale_threshold_s: 3600
  log_sample_rate: 1
  session_median_window: 500
  session_median_min_samples: 30
governor:
  marginal_alpha_window: 50
  marginal_alpha_min_trades: 20
  marginal_alpha_min_bucket: 5
  weekend_entry_buffer_s: 7200
  scalp_min_hold_conflict: true
risk:                            # ACIS-07 v1.1 (SPEC 8) - required block, operational only
  alpha_decay_recent_window: 50  # master SPEC 8 rolling window
  alpha_decay_min_trades: 30     # master SPEC 8 minimum
  alpha_decay_baseline_min_trades: 50   # C5 baseline validity
  alpha_decay_recovery_trades: 20       # GAP-0050 confirmed-recovery gate
  alpha_decay_recovery_mult: 0.8
  var_method: delta_normal_undiversified  # conservative: no diversification credit
  var_window: 50
  var_horizon_seconds: 86400   # 1-day VaR horizon (GAP-0103 declared+scaled; the
                               # 3% var_cap_pct was owner-ratified AS-IS against
                               # this 1-day horizon 2026-07-18. Phase 11 reports
                               # the binding VaR breach frequency once wired in-loop.)
  slippage_window: 20
  eval_cadence_s: 10
  heartbeat_path: logs/heartbeat.json
  heartbeat_interval_s: 10       # SPEC 12 ceiling - schema-enforced <= 10
execution:                       # ACIS-06 v1.1 (SPEC 7) - required block
  fragment_threshold_lots: 1.0
  fragment_size_jitter: [0.85, 1.15]
  fragment_time_jitter_s: [0.5, 3.0]
  min_fragment_lots: 0.10
  vwap_threshold_lots: 5.0
  vwap_window_s: 300
  fast_decay_seconds: 30
  signature_lot_variance: 0.15
  dispatch_budget_ms: 100        # v2.10(c) observability value - never a guardrail
  max_venue_requests_per_day: 900   # GAP-P12D-57: HARD cap per venue over any rolling 24 h; <= the
                                 # cTrader budget minus its close reserve (ACIS-13 v1.0 section 6.5)
                                 # (every submit attempt) - half FTMO's and E8's 2,000/day;
                                 # spent -> opens refused, closes still go through
monitoring:                      # ACIS-08 v1.1 (SPEC 12) - required block
  transport: stdio
  heartbeat_fast_s: 10           # SPEC 12 fast-loop SLA ceiling
  heartbeat_other_s: 60
  missed_beats_flatten: 3        # SPEC 12: 3 missed fast beats + open positions -> flatten rec
  log_tail_max: 500
  tunable_paths:                 # BOUNDED allowlist acis_stage_config may touch (NEVER guardrails);
                                 # a staged value must fall in [min,max] — safe by construction
    - {path: signals.conviction_discard, min: 0.45, max: 0.95}
    - {path: governor.marginal_alpha_window, min: 10, max: 500}
    - {path: regime.stability_window, min: 5, max: 200}
runtime:                         # master section 10 (v2.25) - the position policy's declared values
  max_hold_s: 172800             # 48 h: the backtest book's max hold (engine parity, pinned by test)
  paper_nav_usd: 10000.0         # the paper venue's starting equity
  fast_loop_stall_s: 600         # no tick processed for 10 min while a market is open = a stalled Loop 3
venue:                           # ACIS-13 v1.0 §6.1 - the real venue; absent = mock only
  adapter: ctrader               # master v2.23: the cTrader Open API, first venue a Pepperstone demo
  environment: demo              # must equal the account's isLive (A2); practice mode needs demo
  ctid_trader_account_id: 48971796  # HUMAN-committed 2026-10-01 (owner): Pepperstone demo, traderLogin 5350811; 0 = unbound, attach refuses
  symbol_names: {EUR_USD: EURUSD, USD_JPY: USDJPY, GBP_USD: GBPUSD, AUD_USD: AUDUSD, USD_CAD: USDCAD,
                 USD_CHF: USDCHF, EUR_GBP: EURGBP, EUR_JPY: EURJPY, GBP_JPY: GBPJPY, AUD_JPY: AUDJPY,
                 EUR_CHF: EURCHF, EUR_AUD: EURAUD, CHF_JPY: CHFJPY}   # exact venue names (Pepperstone's list, 2026-10-01 probe), verified at attach
  transport: json_ws             # OQ-02: JSON over WebSocket via aiohttp (no new dependency)
  daily_request_budget: 1000     # schema max 1000 (half the FTMO/E8 cap, GAP-P12D-57)
  close_reserve: 100             # only closes, flatten and stop repair may spend these
  max_orders_per_day: 35         # the section 6.5 order allowance: 4 requests a round trip (ACIS-13 v1.2)
  heartbeat_s: 10                # the documented cadence (F-03); schema max 10
  liveness_timeout_s: 60         # 2x the server's reported 30 s heartbeat (GAP-P12D-132 TAE-03)
  order_ack_timeout_s: 10        # then search by clientOrderId - never a blind resend
  stop_confirm_timeout_s: 3
  equity_poll_s: 300             # the account poll, always (the A9 feasibility check counts it always)
  reconcile_interval_s: 900
  backoff: {base_s: 1, factor: 2, cap_s: 60, max_consecutive: 10}
  rate_limit_per_s: {general: 25, historical: 2}     # half the documented 50 / 5 (F-05)
targets:                         # ACIS-05 v1.7 §6.4 (R1.6): the target-position path; absent = off
  family: trend_d1_v1            # the registered TREND D1 (core/signals/families.py)
  universe: [EUR_USD, USD_JPY, GBP_USD, AUD_USD, USD_CAD, USD_CHF, EUR_GBP, EUR_JPY, GBP_JPY, AUD_JPY,
             EUR_CHF, EUR_AUD, CHF_JPY]   # R6-4's explored FX first; metals and indices after GAP-P12D-27
  idm: 1.5                       # sqrt(N_eff), N_eff = 13 / (1 + 12 x 0.4): a declared prior subsystem correlation 0.4, not data
  buffer: 0.10                   # Carver's band (master §5.5)
  history_days: 1100             # ACIS-04 §4b: at least 3 years of the venue's own H1 bars at first boot
  settle_s: 120                  # decide 2 min after 17:00 New York, once the 16:00 bar is complete
  slot_grace_s: 300              # a slot runs at most 5 min late; later it is skipped, never caught up
  macro_dir: data/macro_live     # `scripts/download_macro.py --live data/macro_live`, refreshed daily on the host
  rate_max_stale_days: 10        # R6-1
